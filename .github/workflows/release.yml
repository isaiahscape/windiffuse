name: Release Windows Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (defaults to v<Version> from DiffuseWindows.csproj)'
        required: false
        default: ''
      prerelease:
        description: 'Mark release as prerelease (test build)'
        type: boolean
        required: false
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Windows Release Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version & release metadata
        id: meta
        shell: pwsh
        run: |
          [xml]$projXml = Get-Content -LiteralPath "DiffuseWindows.csproj"
          $projVer = ($projXml.Project.PropertyGroup.Version | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($projVer)) {
            throw "Could not extract <Version> from DiffuseWindows.csproj"
          }
          $projVer = $projVer.Trim().TrimStart('v', 'V')

          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseTag = "${{ github.ref_name }}"
            $pkgVer = $releaseTag.TrimStart('v', 'V')
            $isPrerelease = "false"
          } else {
            $customTag = "${{ inputs.tag }}".Trim()
            $releaseTag = if ([string]::IsNullOrWhiteSpace($customTag)) { "v$projVer" } else { $customTag }
            $pkgVer = $projVer
            $isPrerelease = if ("${{ inputs.prerelease }}" -eq "true") { "true" } else { "false" }
          }

          "version=$pkgVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish self-contained app & build WinUI 3 installer
        shell: pwsh
        run: |
          & ".\installer\build-installer.ps1" -Version "${{ steps.meta.outputs.version }}"

      - name: Upload release workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: diffuse-windows-${{ steps.meta.outputs.version }}
          path: |
            build/installer/*.exe
            build/installer/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Diffuse for Windows (${{ steps.meta.outputs.version }})"
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            build/installer/*.exe
            build/installer/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
