name: Windows Installer Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional package label (defaults to <Version> from DiffuseWindows.csproj)'
        required: false
        default: ''

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows x64 WinUI 3 Setup & Portable Zip
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve package version
        id: meta
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($ver)) {
            [xml]$projXml = Get-Content -LiteralPath "DiffuseWindows.csproj"
            $projVer = ($projXml.Project.PropertyGroup.Version | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1)
            if ([string]::IsNullOrWhiteSpace($projVer)) {
              throw "Could not extract <Version> from DiffuseWindows.csproj"
            }
            $ver = $projVer.Trim().TrimStart('v', 'V')
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish self-contained app & build WinUI 3 installer
        shell: pwsh
        run: |
          & ".\installer\build-installer.ps1" -Version "${{ steps.meta.outputs.version }}"

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: diffuse-windows-${{ steps.meta.outputs.version }}
          path: |
            build/installer/*.exe
            build/installer/*.zip
          if-no-files-found: error
