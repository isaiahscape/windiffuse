name: Windows Installer Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional package label (defaults to latest short commit hash)'
        required: false
        default: ''

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows x64 MSI & Portable Zip
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve package version
        id: meta
        shell: pwsh
        run: |
          $sha7 = (git rev-parse --short=7 HEAD).Trim()
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = $sha7
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish self-contained app & build MSI
        shell: pwsh
        run: |
          & ".\installer\build-installer.ps1" -Version "${{ steps.meta.outputs.version }}"

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: diffuse-windows-${{ steps.meta.outputs.version }}
          path: |
            build/installer/*.msi
            build/installer/*.zip
          if-no-files-found: error
